# Construit la page et lance tous les tests à chaque envoi sur GitHub (le résultat s'affiche à côté de chaque commit).
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Annonces (privées, dans Supabase)
        env:
          SB_GROUPE: ${{ secrets.SB_GROUPE }}
        run: python3 tools/supabase_annonces.py pull
      - run: npx playwright install --with-deps chromium
      - run: npm test
